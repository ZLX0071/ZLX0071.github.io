<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZLX0071 | 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 720px;
            width: 90%;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: white;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .subtitle {
            text-align: center;
            font-size: 1rem;
            color: #a0a0c0;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 100px;
            background: rgba(102, 126, 234, 0.2);
            color: #a8b4ff;
            font-size: 0.8rem;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .section {
            margin: 2rem 0;
        }

        .section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #c0c0e0;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section h2::before {
            content: '';
            width: 3px;
            height: 1rem;
            background: #667eea;
            border-radius: 2px;
            display: inline-block;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .skills span {
            padding: 0.3rem 0.8rem;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #d0d0e0;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.5rem;
            justify-content: center;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            color: #e0e0e0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .links a:hover {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .links a.primary {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .links a.primary:hover {
            background: #5a6fd6;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #606080;
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">Z</div>
        <h1>ZLX0071</h1>
        <p class="subtitle">
            <span class="badge">AI Product Manager 💡</span>
            &nbsp;
            <span class="badge">AI Agent Intern 🔍</span>
        </p>

        <div class="section">
            <h2>关于我</h2>
            <p style="line-height: 1.8; color: #c0c0d0;">
                热爱 AI 技术与产品设计，专注于 AI Agent 方向的产品经理实习机会。
                擅长从用户需求出发，用技术与商业思维驱动产品创新。
                正在探索 AI 应用的前沿边界，致力于做出真正解决问题的产品。
            </p>
        </div>

        <div class="section">
            <h2>技能领域</h2>
            <div class="skills">
                <span>产品设计</span>
                <span>需求分析</span>
                <span>AI Agent 产品</span>
                <span>数据分析</span>
                <span>用户研究</span>
                <span>A/B 测试</span>
                <span>PRD 撰写</span>
                <span>原型设计</span>
                <span>项目管理</span>
                <span>金融科技</span>
            </div>
        </div>

        <div class="links">
            <a href="https://github.com/ZLX0071" class="primary">GitHub</a>
            <a href="https://linkedin.com/">LinkedIn</a>
            <a href="mailto:zlx0071@example.com">📧 联系我</a>
        </div>

        <footer>
            &copy; 2026 ZLX0071 · Built with ❤️
        </footer>
    </div>
</body>
</html>
